// sensible-storage-specific build logic. Applied last by the shared gradle/build.gradle, so it can
// reconfigure anything that file set up.

// The per-wood textures, item models, recipes and loot tables are datagen-only and gitignored, so a
// fresh clone that skipped `generateAssets` would ship a jar with no chest art and no crafting. This
// can't live in processResources: runDatagen depends on :classes -> :processResources, so that
// check would always fire on a truly fresh clone before runDatagen has produced anything.
// shadowJar — the jar actually shipped — has no such cycle.
tasks.named('shadowJar') {
	doFirst {
		def generated = file('src/main/generated')
		def missing = [
				'assets/sensiblestorage/textures/block/chest/oak.png',
				'assets/sensiblestorage/blockstates/oak_chest.json',
				'assets/sensiblestorage/items/oak_chest_base.json',
				'assets/sensiblestorage/items/oak_chest_lid.json',
				'data/sensiblestorage/recipe/oak_chest.json',
				'data/sensiblestorage/loot_table/blocks/oak_chest.json',
				'assets/sensiblestorage/textures/block/crafting_table/spruce_front.png',
				'assets/sensiblestorage/models/block/spruce_crafting_table.json',
				'data/sensiblestorage/recipe/spruce_crafting_table.json',
				'assets/sensiblestorage/textures/block/bookshelf/spruce.png',
				'assets/sensiblestorage/models/block/spruce_bookshelf.json',
				'data/sensiblestorage/recipe/spruce_bookshelf.json',
				'assets/sensiblestorage/textures/block/chiseled_bookshelf/spruce_occupied.png',
				'assets/sensiblestorage/blockstates/spruce_chiseled_bookshelf.json',
				'data/sensiblestorage/recipe/spruce_chiseled_bookshelf.json',
		].collect { new File(generated, it) }.findAll { !it.exists() }
		if (!missing.isEmpty()) {
			throw new GradleException(
					"Generated datagen output is missing: ${missing*.name.join(', ')}. " +
							'Run: ./gradlew generateAssets')
		}
	}
}

// Server-only mods for the dev server, from run/mods-server rather than run/mods, which
// run/client/mods links to (gradle/devserver.gradle). The live modpack ships the Polymer patches
// side = "server". Loaded on the dev client as well, a patch assigns Polymer's borrowed note block
// states again in the client's own order, which differs from the server's, and the client draws
// the patched mods' blocks as whichever block its own order gave that state.
loom {
	runs {
		server {
			property 'fabric.addMods', file('run/mods-server').absolutePath
		}
	}
}
