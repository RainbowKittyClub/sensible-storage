org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft ships deobfuscated since 26.1, so there is no mappings artifact.
minecraft_version=26.2
fabric_loader_version=0.19.3
fabric_version=0.159.0+26.2
loom_version=1.17.19
shadow_version=9.6.1
polymer_version=0.17.5+26.2

# Datapack pack_format for this project's generated/shipped datapacks (the dev-defaults pack and
# the resourcepacks/ builtin packs). 107 = MC 26.2; bump with minecraft_version.
datapack_pack_format=107

# Shaded from mavenLocal; rebuild kalic0re with publishToMavenLocal when its shared helpers change.
# Only the common/ subpackages listed here come across.
kalic0re_version=0.30.1
kalic0re_shared_packages=item,datagen,net,client,vehicle,display,label,aim,craft,piston,claim,carrier

# Datagen: the providers write raw JSON, read plank PNGs off the datagen classpath and extend
# FabricLanguageProvider. kalic0re's SpecialModelExtentsProvider bakes vanilla's special item
# renderers to measure them, and those are client classes, so datagen boots a client instance.
enable_datagen=true
datagen_client=true

# Java toolchain — read by build.gradle, fabric.mod.json and the mixins json. One place to bump.
java_version=25

# Quilt Loader, for the optional `runQuiltServer` task only (see gradle/devserver.gradle / README).
# Quilt has no stable 26.2 release yet, so this tracks the newest actively-updated beta. The rest are
# the loader's runtime libs from its installer manifest (quilt-loader-<ver>.json), which maven
# metadata doesn't expose — keep them in step when bumping quilt_loader_version.
quilt_loader_version=0.31.0-beta.4
quilt_sponge_mixin_version=0.17.4+mixin.0.8.7
quilt_json5_version=1.0.4+final
quilt_config_version=1.3.3
quilt_asm_version=9.10.1
quilt_mixinextras_version=0.5.5

# Dev-server defaults seeded into run/ by configureRunServer (see gradle/devserver.gradle).
# Every run takes the first two free ports in this block (server, then rcon) and writes them into
# run/server.properties. Keep it clear of 25565–25567, which Docker publishes.
dev_server_ports=25600-25800
dev_rcon_password=dev
# Data version stamped into the seeded options.txt. Without it the client reads it as schema 0, then
# datafixing its key_ entries throws and no seeded option applies. 4903 = MC 26.2; bump alongside.
dev_client_options_version=4903
# Name the dev client joins under. Skips the offline-mode name prompt and is opped in run/ops.json.
dev_client_username=TestPlayer


# Mod Properties
mod_version = 0.6.0
mod_name = Sensible Storage
mod_description = A chest and trapped chest for every wood type, plus hover labels for bookshelves, item frames and armor stands.
mod_authors = ["Rainbow Kitty Club"]
mod_website = https://github.com/RainbowKittyClub/sensible-storage
mod_issues = https://github.com/RainbowKittyClub/sensible-storage/issues
mod_license = CC0-1.0


# Project Properties
maven_group = club.rainbowkitty.sensiblestorage
mod_id = sensiblestorage
entrypoint = club.rainbowkitty.sensiblestorage.SensibleStorage
